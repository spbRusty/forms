<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0D0A2E;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
canvas{user-select:none;-webkit-user-select:none;display:block;touch-action:manipulation;}
#wrapper{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:row;align-items:stretch;justify-content:center;overflow:hidden;}
#game-container{flex:0 1 480px;width:100%;max-width:480px;min-width:0;display:flex;align-items:center;justify-content:center;align-self:center;overflow:hidden;}
@media(max-width:767px){.side-panel{display:none!important;}#game-container{flex:1 1 auto;max-width:100%;width:100%;}}
.side-panel{display:none;flex-direction:column;align-items:center;flex:1 1 0;min-width:100px;position:relative;overflow:hidden;padding:14px 8px;align-self:stretch;
  background:linear-gradient(180deg,#1a1a3a 0%,#141428 55%,#0f0f20 100%);
  border:2px solid rgba(80,170,255,0.25);
  box-shadow:inset 0 0 40px rgba(120,190,255,0.08),0 2px 12px rgba(80,140,220,0.06);
}
#left-panel{border-radius:0;border-right:none;}
#right-panel{border-radius:0;border-left:none;}
body.desktop .side-panel{display:flex;}
body.desktop #game-container canvas{margin:0 auto !important;}
.panel-lbl{color:#7799bb;font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;font-family:'Arial Black',Arial,sans-serif;text-align:center;margin-bottom:8px;position:relative;z-index:3;}
.shape-slot{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(255,255,255,0.08);position:relative;z-index:3;}
#lp-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;width:100%;position:relative;z-index:3;}
.rp-block{width:100%;text-align:center;margin-top:18px;position:relative;z-index:3;}
.rp-lbl{color:#6688aa;font-size:9px;letter-spacing:2px;text-transform:uppercase;font-family:Arial,sans-serif;}
.rp-val{color:#ccddee;font-size:34px;font-weight:bold;font-family:'Arial Black',Arial,sans-serif;margin-top:4px;line-height:1;}
#rp-best-val{color:#ffcc44;font-size:38px;}
.rp-divider{width:80%;height:2px;background:linear-gradient(90deg,transparent,rgba(80,170,255,0.2),transparent);margin:14px auto 0;position:relative;z-index:3;}
#err{position:fixed;bottom:8px;left:8px;color:#ff4444;font-size:11px;font-family:monospace;z-index:9999;pointer-events:none;max-width:90%}
@keyframes shape-shake{0%,100%{transform:scale(1);}25%{transform:scale(1.28) rotate(-8deg);}50%{transform:scale(1.35) rotate(8deg);}75%{transform:scale(1.18) rotate(-4deg);}}
.shape-shake{animation:shape-shake 0.45s ease-in-out;}
</style>
</head>

var SHAPE_TYPES=['circle','triangle','square','diamond','star'];
var LEVEL_COLORS=[
  0xFF3399,
  0x00BBFF,
  0xFF8800,
  0xCC22FF,
  0xFFEE00,
  0x66EE33,
  0xFF3322,
  0x3399FF,
  0xFFFFFF,
  0x00FFCC
];
function shapeTypeForLevel(lvl){return SHAPE_TYPES[(lvl-1)%5];}
function colorForLevel(lvl){
  var shapeIdx=(lvl-1)%5;
  var cycle=Math.floor((lvl-1)/5);
  return LEVEL_COLORS[(shapeIdx+cycle)%LEVEL_COLORS.length];
}
function hexColor(c){return'#'+('000000'+c.toString(16)).slice(-6);}
function darkenCol(col,f){
  var r=((col>>16)&0xFF)*f,g=((col>>8)&0xFF)*f,b=(col&0xFF)*f;
  return(Math.floor(r)<<16)|(Math.floor(g)<<8)|Math.floor(b);
}

function drawFace(g,half,fv){
  var ex=half,ey=half-5;
  if(fv===0){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,8);g.fillCircle(ex+9,ey,8);
    g.fillStyle(0x111122,1);g.fillCircle(ex-7,ey+1,5);g.fillCircle(ex+11,ey+1,5);
    g.fillStyle(0xffffff,.9);g.fillCircle(ex-5,ey-2,2.5);g.fillCircle(ex+13,ey-2,2.5);
  }else if(fv===1){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,9);g.fillCircle(ex+9,ey,9);
    g.fillStyle(0x111122,1);g.fillCircle(ex-8,ey+1,6);g.fillCircle(ex+10,ey+1,6);
    g.fillStyle(0xffffff,.95);g.fillCircle(ex-5,ey-3,3);g.fillCircle(ex+13,ey-3,3);
  }else if(fv===2){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-10,ey,10);g.fillCircle(ex+10,ey,10);
    g.fillStyle(0x111122,1);g.fillCircle(ex-10,ey,6);g.fillCircle(ex+10,ey,6);
    g.fillStyle(0xffffff,.9);g.fillCircle(ex-7,ey-3,2.5);g.fillCircle(ex+13,ey-3,2.5);
  }else if(fv===3){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey+1,8);g.fillCircle(ex+9,ey+1,8);
    g.fillStyle(0x111122,1);g.fillRect(ex-16,ey-4,13,7);g.fillRect(ex+3,ey-4,13,7);
    g.fillStyle(0xffffff,.85);g.fillCircle(ex-7,ey,3);g.fillCircle(ex+11,ey,3);
  }else if(fv===4){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,8);g.fillCircle(ex+9,ey,8);
    g.fillStyle(0x111122,1);g.fillCircle(ex-7,ey+2,5);g.fillCircle(ex+11,ey+2,5);
    g.fillStyle(0x111122,.8);g.fillRect(ex-16,ey-7,12,3.5);g.fillRect(ex+4,ey-7,12,3.5);
    g.fillStyle(0xffffff,.9);g.fillCircle(ex-4,ey-1,2);g.fillCircle(ex+14,ey-1,2);
  }else if(fv===5){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,9);g.fillCircle(ex+9,ey,9);
    g.fillStyle(0xffdd00,1);_miniStar(g,ex-9,ey,5,3.5);_miniStar(g,ex+9,ey,5,3.5);
    g.fillStyle(0x111122,.6);g.fillCircle(ex-9,ey,2.5);g.fillCircle(ex+9,ey,2.5);
  }else if(fv===6){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,8);g.fillCircle(ex+9,ey,8);
    g.fillStyle(0x111122,1);
    g.fillRect(ex-13,ey-4,3.5,11);g.fillRect(ex-16,ey-1,11,3.5);
    g.fillRect(ex+5,ey-4,3.5,11);g.fillRect(ex+3,ey-1,11,3.5);
  }else if(fv===7){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,9);g.fillCircle(ex+9,ey,9);
    g.fillStyle(0xff4466,1);_miniHeart(g,ex-9,ey+1,6);_miniHeart(g,ex+9,ey+1,6);
  }else if(fv===8){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,9);g.fillCircle(ex+9,ey,9);
    g.fillStyle(0x111122,1);g.fillCircle(ex-9,ey,6);g.fillCircle(ex+9,ey,6);
    g.fillStyle(0xffffff,1);g.fillCircle(ex-6,ey-2,3);g.fillCircle(ex+12,ey-2,3);
    g.fillStyle(0x111122,1);g.fillCircle(ex-6,ey-2,1.5);g.fillCircle(ex+12,ey-2,1.5);
  }else if(fv===9){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,8);g.fillCircle(ex+9,ey,8);
    g.fillStyle(0x111122,1);g.fillCircle(ex-7,ey+2,5);g.fillCircle(ex+11,ey+2,5);
    for(var bi=0;bi<5;bi++){g.fillRect(ex-17+bi,ey-9-bi,3,3);}
    for(var bi2=0;bi2<5;bi2++){g.fillRect(ex+4+bi2,ey-9+(4-bi2),3,3);}
  }else if(fv===10){
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,8);
    g.fillStyle(0x111122,1);g.fillCircle(ex-7,ey+1,5);
    g.fillStyle(0xffffff,.9);g.fillCircle(ex-4,ey-2,2.5);
    g.fillStyle(0x111122,1);g.fillRect(ex+3,ey-2,14,3.5);g.fillRect(ex+3,ey-6,4,5);g.fillRect(ex+13,ey-6,4,5);
  }else{
    g.fillStyle(0xffffff,1);g.fillCircle(ex-9,ey,10);g.fillCircle(ex+9,ey,10);
    g.fillStyle(0x111122,1);g.fillCircle(ex-9,ey,6.5);g.fillCircle(ex+9,ey,6.5);
    g.fillStyle(0x6688ff,.7);g.fillCircle(ex-9,ey+2,4.5);g.fillCircle(ex+9,ey+2,4.5);
    g.fillStyle(0xffffff,1);g.fillCircle(ex-6,ey-2,3);g.fillCircle(ex+12,ey-2,3);
    g.fillStyle(0xff8899,.8);g.fillCircle(ex-14,ey+6,4.5);g.fillCircle(ex+14,ey+6,4.5);
  }
  var my2=half+10;
  if(fv===0||fv===8){
    g.fillStyle(0x111122,1);g.fillRect(ex-7,my2,14,3);
  }else if(fv===1||fv===7||fv===11){
    g.fillStyle(0x111122,1);var sp2=[[-8,0],[-5,3],[-1,5],[3,4],[6,1],[8,-1]];
    for(var si=0;si<sp2.length;si++)g.fillCircle(ex+sp2[si][0],my2+sp2[si][1],2.5);
  }else if(fv===2||fv===6){
    g.fillStyle(0x111122,1);g.fillCircle(ex,my2+3,6.5);g.fillStyle(0xff6688,.7);g.fillCircle(ex,my2+3,4.5);
  }else if(fv===3||fv===10){
    g.fillStyle(0x111122,1);var wp=[[-7,2],[-4,0],[-1,2],[2,0],[5,2]];
    for(var wi=0;wi<wp.length;wi++)g.fillCircle(ex+wp[wi][0],my2+wp[wi][1],2.5);
  }else if(fv===4||fv===5){
    g.fillStyle(0x111122,1);g.fillRect(ex-1,my2,11,3);g.fillRect(ex+9,my2-5,3,6);
  }else if(fv===9){
    g.fillStyle(0x111122,1);var fp=[[-6,4],[-3,2],[0,1],[3,2],[6,4]];
    for(var fi=0;fi<fp.length;fi++)g.fillCircle(ex+fp[fi][0],my2+fp[fi][1],2.5);
  }
}
function _miniStar(g,cx,cy,pts,outerR){
  var innerR=outerR*0.4,step=Math.PI/pts;
  for(var i=0;i<pts*2;i++){
    var a0=i*step-Math.PI/2,r0=(i%2===0)?outerR:innerR,a1=(i+1)*step-Math.PI/2,r1=((i+1)%2===0)?outerR:innerR;
    g.fillTriangle(cx,cy,cx+Math.cos(a0)*r0,cy+Math.sin(a0)*r0,cx+Math.cos(a1)*r1,cy+Math.sin(a1)*r1);
  }
}
function _miniHeart(g,cx,cy,r){
  g.fillCircle(cx-r*0.55,cy-r*0.25,r*0.6);g.fillCircle(cx+r*0.55,cy-r*0.25,r*0.6);
  g.fillTriangle(cx-r,cy,cx+r,cy,cx,cy+r*1.3);
}

function _drawShapeOutline(g,half,type,r){
  if(type==='circle'){g.fillCircle(half,half,r);}
  else if(type==='triangle'){var sc=r/(half-5);g.fillTriangle(half,5-(half-5)*(1-sc),6-(6-half)*(1-sc),SZ-8+(SZ-8-half)*(1-sc),SZ-6+(SZ-6-half)*(1-sc),SZ-8+(SZ-8-half)*(1-sc));}
  else if(type==='square'){var d=half-r;g.fillRoundedRect(d,d,(r*2),(r*2),r*0.35);}
  else if(type==='diamond'){g.fillTriangle(half,half-r,half-r,half,half+r,half);g.fillTriangle(half-r,half,half+r,half,half,half+r);}
  else{var oR=r,iR=r*0.38,sC=half,sP=5,sST=Math.PI/sP;for(var si=0;si<sP*2;si++){var sa0=si*sST-Math.PI/2,sr0=(si%2===0)?oR:iR,sa1=(si+1)*sST-Math.PI/2,sr1=((si+1)%2===0)?oR:iR;g.fillTriangle(sC,sC,sC+Math.cos(sa0)*sr0,sC+Math.sin(sa0)*sr0,sC+Math.cos(sa1)*sr1,sC+Math.sin(sa1)*sr1);}}
}

function buildShapeTexture(scene,lvl,fv){
  var key='sh_'+lvl+'_'+fv;
  if(scene.textures.exists(key))return key;
  var half=SZ/2,col=colorForLevel(lvl),type=shapeTypeForLevel(lvl);
  var g=scene.make.graphics({x:0,y:0,add:false});
  var dk=darkenCol(col,0.38);
  /* drop shadow */
  g.fillStyle(0x000000,0.30);
  g.fillCircle(half+3,half+5,half-3);
  /* dark outline layer */
  g.fillStyle(dk,1);
  _drawShapeOutline(g,half,type,half-2);
  /* main color fill */
  g.fillStyle(col,1);
  _drawShapeOutline(g,half,type,half-5);
  /* inner lighter shine top-left */
  g.fillStyle(0xFFFFFF,0.28);
  if(type==='circle'){g.fillCircle(half-7,half-7,(half-5)*0.42);}
  else if(type==='triangle'){g.fillCircle(half,half-4,(half-5)*0.28);}
  else if(type==='square'){g.fillCircle(half-4,half-4,(half-5)*0.35);}
  else if(type==='diamond'){g.fillCircle(half,half-5,(half-5)*0.28);}
  else{g.fillCircle(half,half-5,(half-5)*0.28);}
  drawFace(g,half,fv);
  g.generateTexture(key,SZ,SZ);g.destroy();
  return key;
}
function randomFace(){return Math.floor(Math.random()*NUM_FACES);}
function prebuildAll(scene){for(var l=1;l<=MAX_LEVEL;l++)for(var f=0;f<NUM_FACES;f++)buildShapeTexture(scene,l,f);}

/* ================================================================ STORAGE ================================================================ */
var Storage={
  data:{bestScore:0,totalMerges:0,formsOpened:[],soundOn:true,musicOn:true,firstRun:true},_player:null,
  initPlayer:function(sdk){try{sdk.getPlayer({scopes:false}).then(function(p){Storage._player=p;p.getData().then(function(d){if(d){['bestScore','totalMerges','formsOpened','soundOn','musicOn','firstRun'].forEach(function(k){if(d[k]!==undefined)Storage.data[k]=d[k];});}}).catch(function(){});}).catch(function(){});}catch(e){}},
  load:function(){try{var r=localStorage.getItem('gm30');if(r)Storage.data=Object.assign(Storage.data,JSON.parse(r));}catch(e){}},
  save:function(){try{localStorage.setItem('gm30',JSON.stringify(Storage.data));}catch(e){}if(Storage._player){try{Storage._player.setData(Storage.data);}catch(e){}}},
  updateBest:function(s){if(s>Storage.data.bestScore){Storage.data.bestScore=s;Storage.save();return true;}return false;},
  addForm:function(lvl){if(Storage.data.formsOpened.indexOf(lvl)===-1){Storage.data.formsOpened.push(lvl);Storage.save();return true;}return false;},
  maxUnlocked:function(){if(!Storage.data.formsOpened.length)return 1;return Math.max.apply(null,Storage.data.formsOpened);}
};

function _audioInit(){
  AudioSystem.init();
  AudioSystem.setSoundEnabled(Storage.data.soundOn !== false);
  AudioSystem.setMusicEnabled(Storage.data.musicOn !== false);
  MusicSystem._on = Storage.data.musicOn !== false;
}

// Синонимы SFX для совместимости с кодом сцен
AudioSystem.click    = AudioSystem.playClick;
AudioSystem.merge    = function(lvl){ AudioSystem.playJump(); };
AudioSystem.combo    = AudioSystem.playLapComplete;
AudioSystem.newForm  = AudioSystem.playLapComplete;
AudioSystem.ding     = AudioSystem.playJump;
AudioSystem.over     = AudioSystem.playDeath;
AudioSystem.nearMiss = function(){};
var _soundOn = true;
AudioSystem.isEnabled = function(){ return _soundOn; };
AudioSystem.toggle    = function(){
  _soundOn = !_soundOn;
  AudioSystem.setSoundEnabled(_soundOn);

var LP_ORDER=[1,6,11,16, 2,7,12,17, 3,8,13,18, 4,9,14,19, 5,10,15,20];

function drawShapeVanilla(ctx,sz,level,unlocked){
  var half=sz/2;
  var col=colorForLevel(level);
  var type=shapeTypeForLevel(level);
  var cr=(col>>16)&0xff,cg=(col>>8)&0xff,cb=col&0xff;
  ctx.clearRect(0,0,sz,sz);
  if(unlocked){
    ctx.shadowColor='rgba('+cr+','+cg+','+cb+',0.7)';
    ctx.shadowBlur=6;
    ctx.fillStyle='rgb('+cr+','+cg+','+cb+')';
  }else{
    ctx.shadowBlur=0;
    ctx.fillStyle='rgb(60,60,80)';
  }
  ctx.globalAlpha=unlocked?1:0.38;
  ctx.beginPath();
  if(type==='circle'){ctx.arc(half,half,half-2,0,Math.PI*2);}
  else if(type==='triangle'){ctx.moveTo(half,3);ctx.lineTo(3,sz-4);ctx.lineTo(sz-3,sz-4);ctx.closePath();}
  else if(type==='square'){
    var rr=4;ctx.roundRect?ctx.roundRect(4,4,sz-8,sz-8,rr):ctx.rect(4,4,sz-8,sz-8);
  }
  else if(type==='diamond'){ctx.moveTo(half,2);ctx.lineTo(sz-2,half);ctx.lineTo(half,sz-2);ctx.lineTo(2,half);ctx.closePath();}
  else{var oR=half-2,iR=oR*0.38;for(var i=0;i<10;i++){var a=i*Math.PI/5-Math.PI/2,rad=i%2===0?oR:iR;if(i===0)ctx.moveTo(half+Math.cos(a)*rad,half+Math.sin(a)*rad);else ctx.lineTo(half+Math.cos(a)*rad,half+Math.sin(a)*rad);}ctx.closePath();}
  ctx.fill();
  ctx.shadowBlur=0;
  if(unlocked){
    ctx.globalAlpha=0.28;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(half-4,half-5,half*0.3,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function initLeftPanel(){
  if(_lpBuilt)return;_lpBuilt=true;

    var bY=pY+pH-98;
    mkBtn(this,cx,bY-84,t('continuead'),268,46,0xFF8800,0xCC5500,function(){
      AudioSystem.click();
      Ads.rewarded(function(){
        window._rewardedClearHalf=true;
        self.scene.start('GameScene');
      },function(){});
    });
    mkBtn(this,cx,bY-40,t('again'),248,58,0xFF3399,0xCC1177,function(){AudioSystem.click();if(window.deathCount>=INTER_THRESHOLD){window.deathCount=0;Ads.inter(function(){self.scene.start('GameScene');});}else self.scene.start('GameScene');});
    mkBtn(this,cx,bY+30,t('menu'),204,48,0x5533BB,0x3322AA,function(){AudioSystem.click();if(window.deathCount>=INTER_THRESHOLD){window.deathCount=0;Ads.inter(function(){self.scene.start('MenuScene');});}else self.scene.start('MenuScene');});
    var lbtn=this.add.text(W-16,16,t('langBtn'),{fontSize:'20px',fontStyle:'bold',color:'#AAFFCC',stroke:'#003322',strokeThickness:2,fontFamily:'Arial Black,Arial,sans-serif'}).setOrigin(1,0).setInteractive({useHandCursor:true});
    lbtn.on('pointerdown',function(){AudioSystem.click();switchLang();self.scene.restart();});
  }
});

/* ================================================================ PHASER ================================================================ */
window.game=new Phaser.Game({
  type:Phaser.AUTO,parent:'game-container',backgroundColor:'#0D0A2E',
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:GAME_WIDTH,height:GAME_HEIGHT},
  physics:{default:'arcade',arcade:{gravity:{y:0},debug:DEBUG}},
  scene:[BootScene,MenuScene,GameScene,UIScene,GameOverScene]
});

window.game.events.on('ready',function(){});
</script>
